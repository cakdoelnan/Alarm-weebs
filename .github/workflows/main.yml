name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Extract ZIP otomatis
        run: |
          mkdir -p extracted
          unzip -oq "*.zip" -d extracted
          GRADLE_PATH=$(find extracted -name "settings.gradle*" | head -n 1)
          if [ -z "$GRADLE_PATH" ]; then
            echo "File settings.gradle tidak ditemukan di dalam ZIP!"
            exit 1
          fi
          SRC_DIR=$(dirname "$GRADLE_PATH")
          cp -rf "$SRC_DIR"/. .
          rm -rf extracted *.zip

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Buat debug.keystore otomatis
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Hasil APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Alarm-Weebs-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Alarm Weebs v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
